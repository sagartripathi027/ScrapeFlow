<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Available Jobs — ScrapeFlow</title>

  <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<nav class="navbar">
  <div class="navbar-inner">

    <a href="/" class="brand">
      <span class="brand-mark">
        <i class="fa-solid fa-layer-group"></i>
      </span>
      ScrapeFlow
    </a>

    <div class="nav-links">
      <a href="/" class="nav-link">Dashboard</a>
      <a href="/jobs" class="nav-link active">Jobs</a>
      <a href="/resume-match" class="nav-link">Resume Match</a>
      <a href="/settings" class="nav-link">Settings</a>
    </div>

    <div class="nav-right">
      <a href="/profile" class="nav-link">Profile</a>
      <div class="avatar">SF</div>
    </div>

  </div>
</nav>


<div class="container">

  <div class="page-header">

    <div>
      <h1>Available Jobs</h1>

      <p class="lede">
        Browse and filter jobs discovered from company career pages.
      </p>
    </div>

    <div class="page-actions">

      <button class="btn btn-secondary" id="refresh-jobs-btn">
        <i class="fa-solid fa-rotate-right"></i>
        Refresh Jobs
      </button>

    </div>

  </div>


  <!-- FILTERS -->

  <div class="toolbar">

    <div class="toolbar-search">

      <i class="fa-solid fa-magnifying-glass"></i>

      <input
        type="text"
        id="job-search"
        placeholder="Search job title, company or skill..."
      >

    </div>


    <div class="filter-row">

      <div class="select-field">
        <select id="filter-company">
          <option value="">Company</option>
        </select>
      </div>


      <div class="select-field">
        <select id="filter-location">
          <option value="">Location</option>
        </select>
      </div>


      <div class="select-field">
        <select id="filter-experience">
          <option value="">Experience</option>
          <option value="0-2">0-2 yrs</option>
          <option value="2-4">2-4 yrs</option>
          <option value="4-6">4-6 yrs</option>
          <option value="6+">6+ yrs</option>
        </select>
      </div>


      <div class="select-field">
        <select id="filter-job-type">
          <option value="">Job Type</option>
          <option value="Full-time">Full-time</option>
          <option value="Contract">Contract</option>
          <option value="Internship">Internship</option>
        </select>
      </div>


      <div class="select-field">
        <select id="filter-skill">
          <option value="">Skills</option>
        </select>
      </div>


      <div class="select-field">
        <select id="filter-posted-date">
          <option value="">Posted Date</option>
          <option value="24h">Last 24 hours</option>
          <option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option>
        </select>
      </div>


      <button
        class="clear-filters-btn"
        id="clear-filters-btn">

        Clear Filters

      </button>

    </div>

  </div>
  <!-- COMPANY DISCOVERY -->

<div class="company-discovery">

  <div class="toolbar-search">

    <i class="fa-solid fa-building"></i>

    <input
      type="text"
      id="company-search"
      placeholder="Enter company name e.g. TCS, Infosys, Amazon..."
    >

  </div>

  <button
    class="btn btn-primary"
    id="discover-company-btn">

    <i class="fa-solid fa-magnifying-glass"></i>
    Discover Company Jobs

  </button>

</div>

<div id="discovery-status" class="discovery-status"></div>


  <!-- RESULT COUNT -->

  <div class="result-count" id="result-count">
    <strong>0</strong> jobs found
  </div>


  <!-- JOB LIST -->

  <div class="job-list" id="job-list"></div>


  <!-- PAGINATION -->

  <div class="pagination" id="pagination"></div>

</div>


<footer class="site-footer">

  <div class="container footer-row">

    <span>
      &copy; 2026 ScrapeFlow. All rights reserved.
    </span>

    <div class="footer-links">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Support</a>
    </div>

  </div>

</footer>


<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
